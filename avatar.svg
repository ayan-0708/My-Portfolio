<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="320" rx="36" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="314" height="314" rx="33" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Electronic Circuit Traces -->
  <g stroke="#38bdf8" stroke-width="1.8" opacity="0.3" fill="none" stroke-linecap="round">
    <path d="M 40 60 H 100 L 130 90 H 220" />
    <circle cx="40" cy="60" r="3.5" fill="#38bdf8" />
    <circle cx="220" cy="90" r="3.5" fill="#38bdf8" />

    <path d="M 280 120 H 230 L 200 150 V 220" />
    <circle cx="280" cy="120" r="3.5" fill="#38bdf8" />
    <circle cx="200" cy="220" r="3.5" fill="#38bdf8" />

    <path d="M 50 250 H 110 L 140 220" />
    <circle cx="50" cy="250" r="3.5" fill="#38bdf8" />
    <circle cx="140" cy="220" r="3.5" fill="#38bdf8" />

    <path d="M 260 270 H 190 L 160 240" />
    <circle cx="260" cy="270" r="3.5" fill="#38bdf8" />
    <circle cx="160" cy="240" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Outer Ring with Gradient -->
  <circle cx="160" cy="150" r="82" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.8" filter="url(#glow)" />
  <circle cx="160" cy="150" r="80" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="2.5" />

  <!-- Inner Tech Nodes -->
  <circle cx="160" cy="68" r="4" fill="#38bdf8" />
  <circle cx="242" cy="150" r="4" fill="#6366f1" />
  <circle cx="160" cy="232" r="4" fill="#14b8a6" />
  <circle cx="78" cy="150" r="4" fill="#38bdf8" />

  <!-- Monogram Logo / Engineering Symbol -->
  <g transform="translate(160, 150) scale(1.15)">
    <!-- Stylized 'A' -->
    <path d="M -36 28 L -14 -32 L 8 28 M -28 10 L 0 10" stroke="#f8fafc" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Stylized 'S' intersecting in teal/cyan -->
    <path d="M 2 -4 C 8 -16 22 -20 30 -12 C 38 -4 34 8 18 14 C 4 20 6 32 18 34 C 28 35 34 26 36 20" stroke="url(#primaryGlow)" stroke-width="5.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Badge Bottom -->
  <g transform="translate(160, 272)">
    <rect x="-92" y="-16" width="184" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">B.Tech ETC • DKTE '28</text>
  </g>
</svg>
